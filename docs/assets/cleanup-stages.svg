<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="One dictation through hark's stages. Heard: um so tasting the the build uh on Tuesday, no, Wednesday before friday. Corrections swap tasting for testing. Instant cleanup gives: So testing the build on Tuesday, no, Wednesday before friday. Optional polish gives: Testing the build on Wednesday before Friday.">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .row { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .row-purple { fill: #161b22; stroke: #7c6fe0; stroke-width: 2; }
      .row-green { fill: #161b22; stroke: #2db88a; stroke-width: 2; }
      .row-orange { fill: #161b22; stroke: #e07050; stroke-width: 2; stroke-dasharray: 5 4; }
      .title { fill: #c9d1d9; font: 600 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing: 0.04em; }
      .subtitle { fill: #8b949e; font: 400 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .text { fill: #c9d1d9; font: 500 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .sub { fill: #8b949e; font: 400 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .tag { font: 600 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing: 0.14em; }
      .gone { fill: #e07050; text-decoration: line-through; }
      .fix { fill: #7c6fe0; }
      .ok { fill: #2db88a; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="500"/>

  <text x="600" y="40" text-anchor="middle" class="title">WHAT HAPPENS TO WHAT YOU SAY</text>
  <text x="600" y="62" text-anchor="middle" class="subtitle">real output from hark --clean and hark --refine on an M1</text>

  <!-- 1. Heard -->
  <g transform="translate(60,90)">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.92;1" dur="10s" repeatCount="indefinite"/>
    <rect class="row" width="1080" height="72" rx="10"/>
    <text x="20" y="24" class="tag" fill="#8b949e">HEARD · APPLE SPEECH, ON DEVICE</text>
    <text x="20" y="54" class="text"><tspan class="gone">um</tspan> so <tspan class="fix">tasting</tspan> the <tspan class="gone">the</tspan> build <tspan class="gone">uh</tspan> on Tuesday, no, Wednesday before friday</text>
  </g>

  <!-- 2. Corrections -->
  <g transform="translate(60,182)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.18;0.22;0.92;1" dur="10s" repeatCount="indefinite"/>
    <rect class="row-purple" width="1080" height="72" rx="10"/>
    <text x="20" y="24" class="tag" fill="#7c6fe0">CORRECTIONS · tasting = testing</text>
    <text x="20" y="54" class="text">um so <tspan class="fix">testing</tspan> the the build uh on Tuesday, no, Wednesday before friday</text>
  </g>

  <!-- 3. Instant cleanup -->
  <g transform="translate(60,274)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.40;0.92;1" dur="10s" repeatCount="indefinite"/>
    <rect class="row-green" width="1080" height="72" rx="10"/>
    <text x="20" y="24" class="tag" fill="#2db88a">INSTANT CLEANUP · RULES, NO MODEL · ALWAYS ON</text>
    <text x="20" y="54" class="text"><tspan class="ok">So</tspan> testing the build on Tuesday, no, Wednesday before friday</text>
  </g>

  <!-- 4. Polish -->
  <g transform="translate(60,366)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.60;0.92;1" dur="10s" repeatCount="indefinite"/>
    <rect class="row-orange" width="1080" height="72" rx="10"/>
    <text x="20" y="24" class="tag" fill="#e07050">POLISH · OPT-IN · ON-DEVICE MODEL · 5,049 ms</text>
    <text x="20" y="54" class="text"><tspan class="ok">Testing</tspan> the build on <tspan class="ok">Wednesday</tspan> before <tspan class="ok">Friday.</tspan></text>
  </g>

  <!-- Footer -->
  <g transform="translate(60,475)">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.70;0.74;0.92;1" dur="10s" repeatCount="indefinite"/>
    <circle cx="10" cy="-4" r="5" fill="#e07050"/>
    <text x="22" y="0" class="sub">removed</text>
    <circle cx="130" cy="-4" r="5" fill="#7c6fe0"/>
    <text x="142" y="0" class="sub">corrected</text>
    <circle cx="260" cy="-4" r="5" fill="#2db88a"/>
    <text x="272" y="0" class="sub">fixed</text>
    <text x="1080" y="0" text-anchor="end" class="sub">polish is discarded if it does not read as a cleanup of what you said</text>
  </g>
</svg>
