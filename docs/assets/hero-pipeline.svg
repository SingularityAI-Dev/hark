<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Animated pipeline: the Fn key starts the microphone, Apple's on-device recogniser transcribes, corrections and cleanup run, polish uses the on-device model or a chosen LLM server, and the text is pasted at the cursor. Local by default.">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .boundary { fill: none; stroke: #2db88a; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .node-purple { fill: #161b22; stroke: #7c6fe0; stroke-width: 2; }
      .node-green { fill: #161b22; stroke: #2db88a; stroke-width: 2; }
      .node-orange { fill: #161b22; stroke: #e07050; stroke-width: 2; stroke-dasharray: 5 4; }
      .key { fill: #21262d; stroke: #8b949e; stroke-width: 1.5; }
      .title { fill: #c9d1d9; font: 600 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing: 0.04em; }
      .subtitle { fill: #8b949e; font: 400 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .label { fill: #c9d1d9; font: 700 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing: 0.03em; }
      .sub { fill: #8b949e; font: 400 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .tag { font: 600 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing: 0.14em; }
      .keytext { fill: #c9d1d9; font: 600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="480"/>

  <text x="600" y="40" text-anchor="middle" class="title">HOLD · SPEAK · RELEASE</text>
  <text x="600" y="62" text-anchor="middle" class="subtitle">on-device speech · on-device cleanup · pasted where the cursor is</text>

  <!-- The Mac boundary -->
  <rect class="boundary" x="30" y="90" width="1140" height="320" rx="16"/>
  <text x="50" y="114" class="tag" fill="#2db88a">THIS MAC</text>
  <g transform="translate(1000,100)">
    <path d="M 12 22 a 8 8 0 0 1 2 -15 a 11 11 0 0 1 21 3 a 7 7 0 0 1 1 13 z" fill="none" stroke="#8b949e" stroke-width="1.5"/>
    <line x1="6" y1="26" x2="42" y2="2" stroke="#e07050" stroke-width="2"/>
    <text x="52" y="18" class="tag" fill="#8b949e">LOCAL BY DEFAULT</text>
  </g>

  <!-- 01 trigger -->
  <g transform="translate(50,220)">
    <rect class="node" width="180" height="120" rx="12"/>
    <text x="16" y="24" class="tag" fill="#8b949e">01 · TRIGGER</text>
    <g>
      <rect class="key" x="16" y="40" width="46" height="40" rx="7"/>
      <text x="39" y="66" text-anchor="middle" class="keytext">fn</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 3;0 0" keyTimes="0;0.1;0.6;0.7" dur="4s" repeatCount="indefinite"/>
    </g>
    <text x="76" y="58" class="sub">hold, or</text>
    <text x="76" y="74" class="sub">tap for</text>
    <text x="16" y="104" class="sub">hands-free</text>
  </g>

  <!-- 02 microphone -->
  <g transform="translate(280,220)">
    <rect class="node" width="180" height="120" rx="12"/>
    <text x="16" y="24" class="tag" fill="#8b949e">02 · MICROPHONE</text>
    <g fill="#7c6fe0">
      <rect x="22" y="50" width="8" height="30" rx="3"><animate attributeName="height" values="8;30;14;8" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="61;50;58;61" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="38" y="50" width="8" height="30" rx="3"><animate attributeName="height" values="20;8;34;20" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="55;61;48;55" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="54" y="50" width="8" height="30" rx="3"><animate attributeName="height" values="34;16;8;34" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="48;57;61;48" dur="0.8s" repeatCount="indefinite"/></rect>
      <rect x="70" y="50" width="8" height="30" rx="3"><animate attributeName="height" values="12;28;18;12" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="59;51;56;59" dur="1.0s" repeatCount="indefinite"/></rect>
      <rect x="86" y="50" width="8" height="30" rx="3"><animate attributeName="height" values="8;22;32;8" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="61;54;49;61" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="102" y="50" width="8" height="30" rx="3"><animate attributeName="height" values="26;10;20;26" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="52;60;55;52" dur="0.95s" repeatCount="indefinite"/></rect>
    </g>
    <text x="16" y="104" class="sub">other audio muted</text>
  </g>

  <!-- 03 speech -->
  <g transform="translate(510,220)">
    <rect class="node-purple" width="180" height="120" rx="12"/>
    <text x="16" y="24" class="tag" fill="#7c6fe0">03 · SPEECH</text>
    <text x="16" y="58" class="label">transcribe</text>
    <text x="16" y="82" class="sub">SpeechTranscriber</text>
    <text x="16" y="102" class="sub">Apple, on device</text>
  </g>

  <!-- 04 cleanup -->
  <g transform="translate(740,220)">
    <rect class="node-green" width="180" height="120" rx="12"/>
    <text x="16" y="24" class="tag" fill="#2db88a">04 · CLEANUP</text>
    <text x="16" y="58" class="label">tidy</text>
    <text x="16" y="82" class="sub">corrections list</text>
    <text x="16" y="102" class="sub">fillers, stutters</text>
  </g>

  <!-- 05 paste -->
  <g transform="translate(970,220)">
    <rect class="node" width="180" height="120" rx="12"/>
    <text x="16" y="24" class="tag" fill="#8b949e">05 · PASTE</text>
    <text x="16" y="62" class="label">So testing</text>
    <rect x="124" y="46" width="2" height="20" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="16" y="102" class="sub">at the cursor</text>
  </g>

  <!-- Polish branch -->
  <g transform="translate(740,130)">
    <rect class="node-orange" width="300" height="52" rx="10"/>
    <text x="16" y="22" class="tag" fill="#e07050">POLISH · ON BY DEFAULT</text>
    <text x="16" y="40" class="sub">on-device model, or your LLM server</text>
  </g>
  <g fill="none" stroke="#e07050" stroke-width="1.8" stroke-dasharray="5 4">
    <path d="M 790 220 L 790 182">
      <animate attributeName="stroke-dashoffset" values="0;18" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 1000 182 L 1000 220">
      <animate attributeName="stroke-dashoffset" values="18;0" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <polygon points="1000,220 994,210 1006,210" fill="#e07050"/>
  <text x="600" y="390" text-anchor="middle" class="sub">polish is kept only if it reads as a cleanup of what you said; otherwise step 04's text is used</text>

  <!-- Edges -->
  <g fill="none" stroke-width="2">
    <path d="M 230 280 L 280 280" stroke="#30363d"/>
    <path d="M 460 280 L 510 280" stroke="#7c6fe0"/>
    <path d="M 690 280 L 740 280" stroke="#2db88a"/>
    <path d="M 920 280 L 970 280" stroke="#2db88a"/>
  </g>

  <!-- Packets -->
  <circle r="6" fill="#8b949e" opacity="0">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 230 280 L 280 280"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#7c6fe0" opacity="0">
    <animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M 460 280 L 510 280"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#2db88a" opacity="0">
    <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M 690 280 L 740 280"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#2db88a" opacity="0">
    <animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M 920 280 L 970 280"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Footer legend -->
  <g transform="translate(50,455)">
    <circle cx="10" cy="-4" r="5" fill="#7c6fe0"/>
    <text x="22" y="0" class="sub">speech</text>
    <circle cx="120" cy="-4" r="5" fill="#2db88a"/>
    <text x="132" y="0" class="sub">cleanup</text>
    <circle cx="240" cy="-4" r="5" fill="#e07050"/>
    <text x="252" y="0" class="sub">polish</text>
    <text x="1100" y="0" text-anchor="end" class="sub">native Swift · 0 dependencies</text>
  </g>
</svg>
